<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a49"/><stop offset="0.55" stop-color="#3b2a5c"/><stop offset="1" stop-color="#7a3b4e"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="0.6" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e5483a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- wallpaper + menu bar -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="30" fill="#000" fill-opacity="0.35"/>
  <text x="18" y="20" fill="#fff" font-size="14" font-weight="700"></text>
  <text x="44" y="20" fill="#fff" font-size="14" font-weight="600">Safari</text>
  <text x="1440" y="20" fill="#fff" font-size="13">Wed 10:41</text>
  <rect x="1396" y="8" width="26" height="14" rx="3" fill="url(#ember)"/>

  <!-- zone outlines (center zone is the active one) -->
  <rect x="24" y="48" width="360" height="828" rx="16" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="1216" y="48" width="360" height="828" rx="16" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="404" y="48" width="792" height="828" rx="16" fill="#ff8a3d" fill-opacity="0.07" stroke="#ff8a3d" stroke-opacity="0.9" stroke-width="3"/>

  <!-- left window: Terminal -->
  <g filter="url(#soft)">
    <rect x="32" y="56" width="344" height="812" rx="12" fill="#14161c"/>
    <rect x="32" y="56" width="344" height="34" rx="12" fill="#2a2d36"/><rect x="32" y="78" width="344" height="12" fill="#2a2d36"/>
    <circle cx="52" cy="73" r="6" fill="#ff5f57"/><circle cx="72" cy="73" r="6" fill="#febc2e"/><circle cx="92" cy="73" r="6" fill="#28c840"/>
    <text x="204" y="78" fill="#aab" font-size="13" text-anchor="middle">zsh</text>
    <g fill="#7ee787" font-family="Menlo, monospace" font-size="13">
      <text x="48" y="120">~/hephaestus $ ./test.sh</text>
      <text x="48" y="142" fill="#9aa">Test run with 229 tests passed</text>
      <text x="48" y="164">~/hephaestus $ _</text>
    </g>
  </g>

  <!-- right window: Notes -->
  <g filter="url(#soft)">
    <rect x="1224" y="56" width="344" height="812" rx="12" fill="#fbf3c9"/>
    <rect x="1224" y="56" width="344" height="34" rx="12" fill="#f0e39a"/><rect x="1224" y="78" width="344" height="12" fill="#f0e39a"/>
    <circle cx="1244" cy="73" r="6" fill="#ff5f57"/><circle cx="1264" cy="73" r="6" fill="#febc2e"/><circle cx="1284" cy="73" r="6" fill="#28c840"/>
    <text x="1396" y="124" fill="#4a4320" font-size="18" font-weight="700" text-anchor="middle">Release notes</text>
    <g fill="#6b6334"><rect x="1248" y="150" width="296" height="8" rx="4"/><rect x="1248" y="172" width="260" height="8" rx="4"/><rect x="1248" y="194" width="280" height="8" rx="4"/></g>
  </g>

  <!-- center zone: front window of the stack (Safari) -->
  <g filter="url(#shadow)">
    <rect x="412" y="56" width="776" height="812" rx="12" fill="#ffffff"/>
    <rect x="412" y="56" width="776" height="44" rx="12" fill="#e9e9ee"/><rect x="412" y="88" width="776" height="12" fill="#e9e9ee"/>
    <circle cx="434" cy="78" r="6" fill="#ff5f57"/><circle cx="454" cy="78" r="6" fill="#febc2e"/><circle cx="474" cy="78" r="6" fill="#28c840"/>
    <rect x="560" y="64" width="480" height="28" rx="8" fill="#fff"/>
    <text x="800" y="83" fill="#555" font-size="13" text-anchor="middle">github.com/gianlucanotaro/hephaestus/pull/42</text>
    <text x="800" y="170" fill="#222" font-size="30" font-weight="700" text-anchor="middle">Release script and install instructions</text>
    <g fill="#d9dbe3"><rect x="460" y="210" width="680" height="10" rx="5"/><rect x="460" y="236" width="620" height="10" rx="5"/><rect x="460" y="262" width="650" height="10" rx="5"/></g>
  </g>

  <!-- stack badge on the front window (always visible when 2+ windows share the zone) -->
  <g filter="url(#soft)">
    <rect x="1096" y="62" width="82" height="32" rx="16" fill="url(#ember)"/>
    <rect x="1112" y="72" width="14" height="11" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="1117" y="77" width="14" height="11" rx="2" fill="#e5483a" stroke="#fff" stroke-width="2"/>
    <text x="1156" y="84" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">4</text>
  </g>

  <!-- hover popover: everything stacked in this zone -->
  <g filter="url(#shadow)">
    <rect x="452" y="288" width="696" height="300" rx="22" fill="#1d1f27" fill-opacity="0.94"/>
    <rect x="452.5" y="288.5" width="695" height="299" rx="21.5" fill="none" stroke="#fff" stroke-opacity="0.18"/>
  </g>
  <text x="482" y="326" fill="#ffffff" fill-opacity="0.65" font-size="13" font-weight="700" letter-spacing="1.5">CENTER ZONE  ·  4 WINDOWS</text>
  <text x="1118" y="326" fill="#ffffff" fill-opacity="0.45" font-size="13" text-anchor="end">Esc to dismiss</text>

  <!-- card 1: front (current) -->
  <g>
    <rect x="474" y="348" width="152" height="196" rx="14" fill="#ff8a3d" fill-opacity="0.16" stroke="#ff8a3d" stroke-width="2.5"/>
    <rect x="486" y="360" width="128" height="92" rx="6" fill="#fff"/><rect x="486" y="360" width="128" height="14" rx="6" fill="#e9e9ee"/>
    <rect x="496" y="386" width="90" height="6" rx="3" fill="#cfd2dc"/><rect x="496" y="400" width="104" height="6" rx="3" fill="#dfe1e8"/>
    <circle cx="496" cy="472" r="9" fill="#2f8cff"/><text x="512" y="477" fill="#fff" font-size="13" font-weight="700">Safari</text>
    <text x="486" y="500" fill="#fff" fill-opacity="0.7" font-size="12">Pull request #42 ·</text><text x="486" y="515" fill="#fff" fill-opacity="0.7" font-size="12">GitHub</text>
    <rect x="486" y="524" width="48" height="14" rx="7" fill="url(#ember)"/><text x="510" y="535" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">FRONT</text>
  </g>
  <!-- card 2 -->
  <g>
    <rect x="638" y="348" width="152" height="196" rx="14" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="650" y="360" width="128" height="92" rx="6" fill="#14161c"/><rect x="650" y="360" width="128" height="14" rx="6" fill="#2a2d36"/>
    <rect x="660" y="386" width="80" height="5" rx="2" fill="#7ee787"/><rect x="660" y="398" width="100" height="5" rx="2" fill="#4f9a58"/>
    <circle cx="660" cy="472" r="9" fill="#34c759"/><text x="676" y="477" fill="#fff" font-size="13" font-weight="700">Terminal</text>
    <text x="650" y="500" fill="#fff" fill-opacity="0.7" font-size="12">build.sh, zsh</text>
  </g>
  <!-- card 3 -->
  <g>
    <rect x="802" y="348" width="152" height="196" rx="14" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="814" y="360" width="128" height="92" rx="6" fill="#fbf3c9"/><rect x="814" y="360" width="128" height="14" rx="6" fill="#f0e39a"/>
    <rect x="824" y="386" width="70" height="6" rx="3" fill="#b9ad6a"/><rect x="824" y="400" width="96" height="6" rx="3" fill="#cdc27f"/>
    <circle cx="824" cy="472" r="9" fill="#ffcc00"/><text x="840" y="477" fill="#fff" font-size="13" font-weight="700">Notes</text>
    <text x="814" y="500" fill="#fff" fill-opacity="0.7" font-size="12">Release notes</text>
  </g>
  <!-- card 4 -->
  <g>
    <rect x="966" y="348" width="152" height="196" rx="14" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="978" y="360" width="128" height="92" rx="6" fill="#2b3a55"/><rect x="978" y="360" width="128" height="14" rx="6" fill="#3a4a68"/>
    <rect x="988" y="386" width="60" height="6" rx="3" fill="#8fb0ff"/><rect x="988" y="400" width="92" height="6" rx="3" fill="#5f7fc8"/>
    <circle cx="988" cy="472" r="9" fill="#7d5cff"/><text x="1004" y="477" fill="#fff" font-size="13" font-weight="700">Code</text>
    <text x="978" y="500" fill="#fff" fill-opacity="0.7" font-size="12">Layout.swift</text>
  </g>

  <!-- mouse cursor on the stack badge -->
  <g transform="translate(1124,84)">
    <path d="M0 0 L0 24 L6 18 L11 29 L15 27 L10 16 L18 16 Z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- numbered callouts -->
  <g font-weight="800" font-size="16" text-anchor="middle">
    <circle cx="1068" cy="78" r="15" fill="#fff"/><text x="1068" y="84" fill="#e5483a">1</text>
    <circle cx="1136" cy="288" r="15" fill="#fff"/><text x="1136" y="294" fill="#e5483a">2</text>
    <circle cx="552" cy="348" r="15" fill="#fff"/><text x="552" y="354" fill="#e5483a">3</text>
  </g>
  <g font-size="15" fill="#fff">
    <text x="640" y="20" font-weight="800" fill="#ffd166">MOCK · stack hover</text>
  </g>
  <rect x="452" y="640" width="696" height="132" rx="16" fill="#1d1f27" fill-opacity="0.96"/>
  <g fill="#fff" font-size="15">
    <text x="480" y="684"><tspan font-weight="800" fill="#ffd166">1</tspan>  A badge on the front window shows how many windows share its zone.</text>
    <text x="480" y="716"><tspan font-weight="800" fill="#ffd166">2</tspan>  Hover it (or the title bar) and a tray lists every window stacked underneath.</text>
    <text x="480" y="748"><tspan font-weight="800" fill="#ffd166">3</tspan>  Click one to bring it to the front. It stays in the zone; the old front goes behind.</text>
  </g>
</svg>
