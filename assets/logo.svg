<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Hephaestus</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34323a"/>
      <stop offset="1" stop-color="#17161b"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e5483a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6b78"/>
      <stop offset="1" stop-color="#4a4853"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- macOS icon grid: 824pt squircle-ish tile centered on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- heat glow behind the active zone -->
  <ellipse cx="512" cy="512" rx="330" ry="300" fill="url(#glow)"/>
  <!-- zones: left / center (16:9-ish, active) / right -->
  <rect x="190" y="312" width="150" height="400" rx="34" fill="url(#steel)"/>
  <rect x="372" y="312" width="280" height="400" rx="40" fill="url(#ember)"/>
  <rect x="684" y="312" width="150" height="400" rx="34" fill="url(#steel)"/>
  <!-- highlight sheen on the active zone -->
  <rect x="372" y="312" width="280" height="400" rx="40" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
</svg>
